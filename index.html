<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — OPA OFFICIAL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/login.css">
</head>
<body class="login-body">
<div class="noise"></div>

<main class="login">
  <div class="login__stripe"></div>

  <section class="login__card">
    <div class="login__brand">
      <img src="logo.png" alt="OPA OFFICIAL" class="login__logo">
      <div>
        <p class="login__eyebrow">Free Fire Guild</p>
        <h1 class="login__title">OPA <span>OFFICIAL</span></h1>
      </div>
    </div>

    <div class="tabs" role="tablist">
      <button class="tabs__btn active" data-tab="login" role="tab">Login</button>
      <button class="tabs__btn" data-tab="signup" role="tab">Create Akun</button>
    </div>

    <div class="form-alert form-alert--error" id="alertError"></div>
    <div class="form-alert form-alert--ok" id="alertOk"></div>
    <div class="form-alert form-alert--error" id="alertConfig">
      Firebase belum dikonfigurasi. Isi <b>js/firebase-config.js</b> dengan config dari Firebase Console.
    </div>

    <!-- LOGIN -->
    <form class="login__form active" id="formLogin" data-panel="login" novalidate>
      <div class="field">
        <label for="loginUser">Username</label>
        <input type="text" id="loginUser" autocomplete="username" placeholder="Masukkan username" required>
      </div>
      <div class="field">
        <label for="loginPass">Password</label>
        <div class="pass-wrap">
          <input type="password" id="loginPass" autocomplete="current-password" placeholder="Masukkan password" required>
          <button type="button" class="pass-toggle" data-toggle="loginPass" aria-label="Tampilkan password">Lihat</button>
        </div>
      </div>
      <button type="submit" class="btn btn--primary btn--block" id="btnLogin"><span>Login</span></button>
      <p class="login__switch">Belum punya akun? <a href="#" data-goto="signup">Create Akun</a></p>
    </form>

    <!-- SIGN UP -->
    <form class="login__form" id="formSignup" data-panel="signup" novalidate>
      <div class="field">
        <label for="signUser">Username</label>
        <input type="text" id="signUser" autocomplete="username" placeholder="Huruf/angka, 3-20 karakter" required>
      </div>
      <div class="field">
        <label for="signPass">Password</label>
        <div class="pass-wrap">
          <input type="password" id="signPass" autocomplete="new-password" placeholder="Minimal 6 karakter" required>
          <button type="button" class="pass-toggle" data-toggle="signPass" aria-label="Tampilkan password">Lihat</button>
        </div>
      </div>
      <div class="field">
        <label for="signPass2">Ulangi password</label>
        <input type="password" id="signPass2" autocomplete="new-password" placeholder="Ketik ulang password" required>
      </div>
      <button type="submit" class="btn btn--primary btn--block" id="btnSignup"><span>Buat Akun</span></button>
      <p class="login__switch">Sudah punya akun? <a href="#" data-goto="login">Login</a></p>
    </form>
  </section>
</main>

<script type="module" src="js/auth.js"></script>
</body>
</html>
